<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comprovante – Protótipo</title>
  <style>
    :root {
      --page: #0b0d12;
      --bg: #161a23;
      --text: #f2f4f8;
      --muted: #8b93a5;
      --line: #2b3140;
      --accent: #ec7000;
      --ok: #22c993;
      --warn: #f5b301;
      --warn-text: #1a1300;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: var(--page);
    }

    body {
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: var(--bg);
    }

    /* ---------- Comprovante (área exportada como imagem) ---------- */
    .receipt {
      position: relative;
      background: var(--bg);
      overflow: hidden;
    }

    .sim-banner {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--warn);
      color: var(--warn-text);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .receipt-body {
      padding: 0 24px;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar .icon {
      width: 26px;
      height: 26px;
      color: var(--accent);
      display: block;
    }

    .topbar .icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .topbar-title {
      font-size: 18px;
      font-weight: 600;
    }

    .check {
      width: 72px;
      height: 72px;
      margin: 24px auto 0;
      border-radius: 50%;
      background: var(--ok);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check svg {
      width: 36px;
      height: 36px;
    }

    .hero {
      margin-top: 24px;
      text-align: center;
    }

    .hero-line {
      display: block;
      width: 100%;
      height: 40px;
      line-height: 40px;
      font: 700 30px/40px var(--font);
      color: var(--text);
      text-align: center;
    }

    .section-title {
      margin-top: 40px;
      height: 28px;
      line-height: 28px;
      font-size: 19px;
      font-weight: 600;
    }

    .section-title.second {
      margin-top: 32px;
    }

    .rows {
      margin-top: 12px;
    }

    .row {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .label {
      flex: none;
      font-size: 15px;
      color: var(--muted);
    }

    .value {
      flex: 1 1 auto;
      min-width: 0;
      text-align: right;
      font: 600 15px/24px var(--font);
      color: var(--text);
    }

    .row-id {
      height: 70px;
    }

    .row-id .label {
      display: block;
      line-height: 24px;
    }

    .id-value {
      display: block;
      line-height: 30px;
      font-size: 16px;
      font-weight: 600;
      word-break: break-all;
    }

    .divider {
      border: 0;
      border-top: 1px dashed var(--line);
      margin-top: 20px;
      height: 1px;
    }

    .foot-note {
      height: 36px;
      line-height: 36px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }



    /* ---------- Campos editáveis ---------- */
    input.editable {
      background: transparent;
      border: 0;
      border-radius: 0;
      outline: none;
      color: var(--text);
      caret-color: var(--accent);
    }

    input.editable:focus {
      background: rgba(236, 112, 0, .12);
    }

    .hero-line.editable {
      height: 40px;
    }

    /* ---------- Ações (fora da imagem exportada) ---------- */
    .actions {
      padding: 20px 24px 40px;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font: 600 17px var(--font);
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    .btn.secondary {
      background: transparent;
      border: 1.5px solid var(--accent);
      color: var(--accent);
      margin-top: 14px;
    }

    .btn[disabled] {
      opacity: .6;
      cursor: progress;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .fallback {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px dashed var(--line);
    }

    .fallback p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .fallback img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    /* ---------- Responsividade ---------- */
    @media (min-width: 520px) {
      body {
        padding: 24px 0;
      }

      .app {
        min-height: 0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
      }
    }

    @media (max-width: 360px) {

      .receipt-body,
      .actions {
        padding-left: 16px;
        padding-right: 16px;
      }

      .sim-banner {
        font-size: 10px;
      }

      .hero-line {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <div class="receipt" id="receipt">
      <div class="receipt-body">
        <header class="topbar">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </span>
          <h2 class="topbar-title">Comprovante</h2>
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M6 3h12v18H6z M9.5 8h5 M9.5 12h5 M9.5 16h3" />
            </svg>
          </span>
        </header>

        <div class="check" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M5.5 12.5l4.2 4.2 8.8-9.4" />
          </svg>
        </div>

        <section class="hero">
          <div class="hero-line">Pix enviado</div>
          <input id="valor" class="hero-line editable" type="text" inputmode="numeric" autocomplete="off"
            aria-label="Valor da transação (R$)" value="R$ 40,00">
        </section>

        <h3 class="section-title">Sobre a transação</h3>
        <div class="rows">
          <div class="row">
            <span class="label">Data da transação</span>
            <span class="value" id="data">—</span>
          </div>
          <div class="row">
            <span class="label">Horário</span>
            <span class="value" id="hora">—</span>
          </div>
          <div class="row-id">
            <span class="label">ID da transação</span>
            <span class="id-value" id="txid">—</span>
          </div>
        </div>

        <hr class="divider">

        <h3 class="section-title second">Quem recebeu</h3>
        <div class="rows">
          <label class="row">
            <span class="label">Nome</span>
            <input id="nome" class="value editable" type="text" autocomplete="off" value="Bruna de Souza">
          </label>
          <label class="row">
            <span class="label">CPF/CNPJ</span>
            <input id="cpf" class="value editable" type="text" autocomplete="off" value="***.276.708-**">
          </label>
          <label class="row">
            <span class="label">Instituição</span>
            <input id="instituicao" class="value editable" type="text" autocomplete="off" value="BANCO PICPAY S.A.">
          </label>
          <label class="row">
            <span class="label">Chave Pix</span>
            <input id="chave" class="value editable" type="text" autocomplete="off" value="384.276.708-00">
          </label>
        </div>

        <hr class="divider">
      </div>

      <div class="wm" aria-hidden="true"></div>
    </div>

    <div class="actions">
      <noscript>
        <p class="hint" style="color:#f5b301">JavaScript bloqueado neste visualizador: data, horário e compartilhamento
          não funcionam. Abra o arquivo em um navegador.</p>
      </noscript>
      <button type="button" id="btn-share" class="btn">Compartilhar comprovante</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section id="fallback" class="fallback" hidden>
        <p>O compartilhamento nativo não está disponível neste navegador. Salve a imagem para compartilhar:</p>
        <img id="preview" alt="Prévia do comprovante gerado">
        <a id="download" class="btn secondary" download="comprovante-simulado.png">Baixar imagem (PNG)</a>
      </section>
    </div>

  </main>

  <script>
    (function () {
      'use strict';

      var $ = function (id) { return document.getElementById(id); };
      var pad = function (n) { return String(n).padStart(2, '0'); };

      /* ------------------------------------------------------------------
       * Data, horário e ID (a cada carregamento da página)
       * ------------------------------------------------------------------ */
      function atualizarDataHora() {
        var d = new Date();
        var semana = [ 'Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado' ][ d.getDay() ];

        $('data').textContent = semana + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
        $('hora').textContent = pad(d.getHours()) + 'h' + pad(d.getMinutes());

        // ID de protótipo: prefixo "SIM" deixa explícito que não é uma transação real
        var alfa = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        var rnd = '';
        for (var i = 0; i < 12; i++) rnd += alfa.charAt(Math.floor(Math.random() * alfa.length));
        $('txid').textContent = 'SIM' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
          pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()) + rnd;
      }

      atualizarDataHora();
      window.addEventListener('pageshow', atualizarDataHora);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') atualizarDataHora();
      });

      /* ------------------------------------------------------------------
       * Campo de valor: máscara monetária (digita centavos, aceita qualquer valor)
       * ------------------------------------------------------------------ */
      function formatarBRL(digitos) {
        var n = Number(digitos || '0') / 100;
        return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      var valor = $('valor');
      valor.addEventListener('input', function () {
        var d = valor.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
        valor.value = formatarBRL(d);
        try { valor.setSelectionRange(valor.value.length, valor.value.length); } catch (e) { }
      });
      valor.addEventListener('focus', function () {
        setTimeout(function () { valor.setSelectionRange(valor.value.length, valor.value.length); }, 0);
      });
      valor.value = formatarBRL(valor.value.replace(/\D/g, ''));

      /* ------------------------------------------------------------------
       * Renderização do comprovante em canvas (sem dependências externas)
       * Coordenadas espelham o CSS (largura lógica 480px, escala 3x).
       * ------------------------------------------------------------------ */
      var W = 480, H = 856, SCALE = 3, OY = 28;

      var ICONS = {
        back: 'M15 5l-7 7 7 7',
        doc: 'M6 3h12v18H6z M9.5 8h5 M9.5 12h5 M9.5 16h3',
        check: 'M5.5 12.5l4.2 4.2 8.8-9.4'
      };

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function desenharComprovante() {
        var cv = document.createElement('canvas');
        cv.width = W * SCALE;
        cv.height = H * SCALE;
        var ctx = cv.getContext('2d');
        ctx.scale(SCALE, SCALE);
        ctx.textBaseline = 'middle';

        var FONT = getComputedStyle(document.body).fontFamily;
        var C = {
          bg: cssVar('--bg'), text: cssVar('--text'), muted: cssVar('--muted'), line: cssVar('--line'),
          accent: cssVar('--accent'), ok: cssVar('--ok'), warn: cssVar('--warn'), warnText: cssVar('--warn-text')
        };

        function texto(str, x, y, o) {
          var size = o.size, w = o.weight || 400;
          ctx.textAlign = o.align || 'left';
          ctx.fillStyle = o.color || C.text;
          ctx.font = w + ' ' + size + 'px ' + FONT;
          if (o.maxW) {
            while (ctx.measureText(str).width > o.maxW && size > 10) {
              size -= 0.5;
              ctx.font = w + ' ' + size + 'px ' + FONT;
            }
          }
          ctx.fillText(str, x, y);
          return ctx.measureText(str).width;
        }

        function icone(d, x, y, tam, cor, largura) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(tam / 24, tam / 24);
          ctx.strokeStyle = cor;
          ctx.lineWidth = largura;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke(new Path2D(d));
          ctx.restore();
        }

        // Fundo
        ctx.fillStyle = C.bg;
        ctx.fillRect(0, 0, W, H);

        // Faixa de simulação
        ctx.fillStyle = C.warn;
        ctx.fillRect(0, 0, W, OY);
        texto('SIMULAÇÃO · PROTÓTIPO · SEM VALOR COMO COMPROVANTE', W / 2, OY / 2, {
          size: 11, weight: 700, color: C.warnText, align: 'center'
        });

        ctx.save();
        ctx.translate(0, OY);

        // Topbar
        icone(ICONS.back, 24, 19, 26, C.accent, 2.2);
        texto('Comprovante', W / 2, 32, { size: 18, weight: 600, align: 'center' });
        icone(ICONS.doc, 430, 19, 26, C.accent, 2.2);

        // Círculo de confirmação
        ctx.fillStyle = C.ok;
        ctx.beginPath();
        ctx.arc(W / 2, 124, 36, 0, Math.PI * 2);
        ctx.fill();
        icone(ICONS.check, W / 2 - 18, 106, 36, '#fff', 2.2);

        // Título + valor
        texto('Pix enviado', W / 2, 204, { size: 30, weight: 700, align: 'center' });
        texto($('valor').value, W / 2, 244, { size: 30, weight: 700, align: 'center', maxW: 432 });

        // Linha rótulo/valor
        function linha(rotulo, valorTxt, cy) {
          var lw = texto(rotulo, 24, cy, { size: 15, color: C.muted });
          texto(valorTxt, 456, cy, { size: 15, weight: 600, align: 'right', maxW: 432 - lw - 16 });
        }
        function titulo(str, cy) {
          texto(str, 24, cy, { size: 19, weight: 600 });
        }
        function tracejado(y) {
          ctx.strokeStyle = C.line;
          ctx.lineWidth = 1;
          ctx.setLineDash([ 6, 4 ]);
          ctx.beginPath();
          ctx.moveTo(24, y + 0.5);
          ctx.lineTo(W - 24, y + 0.5);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Seção 1
        titulo('Sobre a transação', 318);
        linha('Data da transação', $('data').textContent, 366);
        linha('Horário', $('hora').textContent, 410);
        texto('ID da transação', 24, 444, { size: 15, color: C.muted });
        texto($('txid').textContent, 24, 471, { size: 16, weight: 600, maxW: 432 });
        tracejado(522);

        // Seção 2
        titulo('Quem recebeu', 569);
        linha('Nome', $('nome').value, 617);
        linha('CPF/CNPJ', $('cpf').value, 661);
        linha('Instituição', $('instituicao').value, 705);
        linha('Chave Pix', $('chave').value, 749);
        tracejado(791);

        texto('Documento simulado gerado em ambiente de protótipo', W / 2, 810, {
          size: 11, color: C.muted, align: 'center'
        });

        ctx.restore();

        // Marca d'água diagonal
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, OY, W, H - OY);
        ctx.clip();
        ctx.fillStyle = 'rgba(255,255,255,0.07)';
        ctx.font = '700 16px Arial, sans-serif';
        ctx.textAlign = 'center';
        for (var y = 0; y < H; y += 140) {
          for (var x = 0; x < W + 260; x += 260) {
            ctx.save();
            ctx.translate(x + 130, y + 70);
            ctx.rotate(-25 * Math.PI / 180);
            ctx.fillText('SIMULAÇÃO', 0, 0);
            ctx.restore();
          }
        }
        ctx.restore();

        return cv;
      }

      function canvasParaBlob(cv) {
        return new Promise(function (resolve, reject) {
          cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('Falha ao gerar a imagem.')); }, 'image/png');
        });
      }

      /* ------------------------------------------------------------------
       * Compartilhamento: navigator.share (arquivo) -> fallback PNG
       * ------------------------------------------------------------------ */
      var btn = $('btn-share');
      var status = $('status');
      var fallback = $('fallback');
      var urlAtual = null;

      function mostrarFallback(blob) {
        if (urlAtual) URL.revokeObjectURL(urlAtual);
        urlAtual = URL.createObjectURL(blob);
        $('preview').src = urlAtual;
        $('download').href = urlAtual;
        fallback.hidden = false;
        fallback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      btn.addEventListener('click', async function () {
        btn.disabled = true;
        status.textContent = 'Gerando imagem…';
        fallback.hidden = true;

        try {
          var blob = await canvasParaBlob(desenharComprovante());
          var arquivo = new File([ blob ], 'comprovante-simulado.png', { type: 'image/png' });

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [ arquivo ] })) {
            try {
              await navigator.share({ files: [ arquivo ], title: 'Comprovante (simulação)' });
              status.textContent = 'Comprovante compartilhado.';
              return;
            } catch (err) {
              if (err && err.name === 'AbortError') { status.textContent = ''; return; }
              // Qualquer outro erro do share: cai no fallback abaixo
            }
          }

          mostrarFallback(blob);
          status.textContent = 'Imagem gerada. Baixe ou salve para compartilhar.';
        } catch (e) {
          status.textContent = 'Não foi possível gerar a imagem: ' + e.message;
        } finally {
          btn.disabled = false;
        }
      });
    })();

  </script>
</body>

</html>
